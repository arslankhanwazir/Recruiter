<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vertex Traders - Hiring Pipeline</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0a0a0a; color: white; display: flex; height: 100vh; }
        
        /* Left: Persona */
        #left-panel { width: 300px; padding: 20px; border-right: 1px solid #333; background: #111; }
        #ai-avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #333; margin-bottom: 10px; }
        .live-dot { height: 12px; width: 12px; background-color: #4CAF50; border-radius: 50%; display: inline-block; }
        .glow { box-shadow: 0 0 15px blue; border-color: blue !important; }

        /* Center: Webcam */
        #center-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #candidate-video { width: 70%; border-radius: 10px; border: 2px solid #444; background: #000; }

        /* Right: Notes */
        #right-panel { width: 300px; padding: 20px; border-left: 1px solid #333; background: #111; }
        textarea { width: 100%; height: 70%; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div id="left-panel">
    <img id="ai-avatar" src="danny.jpg" alt="Danny Cole">
    <h2>Danny Cole</h2>
    <p><strong>Travel Agency Owner</strong></p>
    <p><span class="live-dot"></span> Status: Live</p>
    <p style="font-size: 0.9em; color: #888;">"I need to automate my travel bookings and emails. Everything is currently manual."</p>
</div>

<div id="center-panel">
    <video id="candidate-video" autoplay playsinline></video>
    <div style="margin-top: 20px;">
        <button onclick="startInterview()">Start Interview</button>
        <button onclick="submitInterview()">Terminate & Analyze</button>
    </div>
</div>

<div id="right-panel">
    <h3>Notes</h3>
    <textarea id="notepad" placeholder="Identify business bottlenecks here..."></textarea>
</div>

<script>
    async function startInterview() {
        // Access Camera
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('candidate-video').srcObject = stream;
        document.getElementById('ai-avatar').classList.add('glow');
        alert("Danny: 'Hi, I'm Danny. I'm drowning in manual emails. How can you automate my business?'");
    }

    async function submitInterview() {
        const payload = {
            candidateName: "Candidate",
            candidateNotes: document.getElementById('notepad').value,
            transcript: "Candidate engaged in discovery call."
        };

        // Submit to n8n
        await fetch('YOUR_N8N_WEBHOOK_URL', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        alert("Interview submitted. HR will receive your scorecard shortly.");
        window.location.reload();
    }
</script>
</body>
</html>
