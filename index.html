<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vertex AI Discovery Simulator</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: sans-serif; background: #121212; color: white; }
        #left-panel { width: 300px; padding: 20px; border-right: 1px solid #333; text-align: center; }
        #center-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #right-panel { width: 300px; padding: 20px; border-left: 1px solid #333; }
        #ai-avatar { width: 150px; border-radius: 50%; border: 4px solid #555; }
        .listening { border-color: red !important; box-shadow: 0 0 15px red; }
        .speaking { border-color: blue !important; box-shadow: 0 0 15px blue; }
        video { width: 100%; max-width: 500px; background: #000; }
        textarea { width: 100%; height: 80%; background: #222; color: white; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="left-panel">
    <img id="ai-avatar" src="https://via.placeholder.com/150" alt="Danny Cole">
    <h2>Danny Cole</h2>
    <p>Travel Agency Owner</p>
    <div id="status">● Status: Idle</div>
</div>

<div id="center-panel">
    <video id="candidate-video" autoplay playsinline></video>
    <div style="margin-top: 20px;">
        <button onclick="startInterview()">Start Interview</button>
        <button onclick="submitInterview()">Terminate Call</button>
    </div>
</div>

<div id="right-panel">
    <h3>Notes</h3>
    <textarea id="notepad" placeholder="Note down business bottlenecks here..."></textarea>
</div>

<script>
    let stream;
    const webhookUrl = 'https://stitchlabai.space/webhook/interview-submitted';

    async function startInterview() {
        // 1. Get Camera/Mic
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('candidate-video').srcObject = stream;
        document.getElementById('status').innerText = "● Status: Live";
        
        // 2. Initialize Web Speech API for Mock Call
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.onstart = () => document.getElementById('ai-avatar').className = 'listening';
        recognition.onend = () => document.getElementById('ai-avatar').className = 'speaking';
        recognition.start();
    }

    async function submitInterview() {
        const payload = {
            candidateName: "Candidate Name", // In production, add an input field for this
            candidateNotes: document.getElementById('notepad').value,
            transcript: "Mock transcript data..." // Captured from recognition
        };

        await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        alert("Interview Submitted for Evaluation.");
    }
</script>
</body>
</html>
